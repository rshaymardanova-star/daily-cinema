services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dailycinema
      POSTGRES_PASSWORD: dailycinema
      POSTGRES_DB: dailycinema
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailycinema"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gcs:
    image: fsouza/fake-gcs-server
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://gcs:4443"]
    ports:
      - "4443:4443"
    volumes:
      - gcsdata:/data

  ml:
    build:
      context: ./ml_module
    ports:
      - "8001:8001"
    environment:
      GCS_ENDPOINT: "http://gcs:4443"
      GCS_BUCKET: "dailycinema"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - gcs
      - redis

  unity:
    build:
      context: ./unity_worker
    ports:
      - "8002:8002"
    environment:
      GCS_ENDPOINT: "http://gcs:4443"
      GCS_BUCKET: "dailycinema"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - gcs
      - redis

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://dailycinema:dailycinema@db:5432/dailycinema"
      DATABASE_URL_SYNC: "postgresql+psycopg2://dailycinema:dailycinema@db:5432/dailycinema"
      GCS_ENDPOINT: "http://gcs:4443"
      GCS_BUCKET: "dailycinema"
      ML_SERVICE_URL: "http://ml:8001"
      UNITY_SERVICE_URL: "http://unity:8002"
      REDIS_URL: "redis://redis:6379/0"
      API_KEY: "dc-prod-api-key-change-me"
      LOG_LEVEL: "INFO"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gcs:
        condition: service_started
      ml:
        condition: service_started
      unity:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    depends_on:
      - backend
      - ml
      - unity

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/loki

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  pgdata:
  redisdata:
  gcsdata:
  prometheusdata:
  grafanadata:
  lokidata:
