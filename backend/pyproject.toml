[tool.poetry]
name = "dailycinema-backend"
version = "0.1.0"
description = "Daily Cinema Backend API"
authors = ["Daily Cinema"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["standard"], version = "^0.115.0"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.30.0"
alembic = "^1.13.0"
google-cloud-storage = "^2.14.0"
httpx = "^0.27.0"
pydantic-settings = "^2.1.0"
psycopg2-binary = "^2.9.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
