apiVersion: apps/v1
kind: Deployment
metadata:
  name: unity-worker
  namespace: dailycinema
  labels:
    app: unity-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unity-worker
  template:
    metadata:
      labels:
        app: unity-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: unity-worker
          image: ghcr.io/dailycinema/unity-worker:latest
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: dailycinema-secrets
            - configMapRef:
                name: dailycinema-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unity-service
  namespace: dailycinema
spec:
  selector:
    app: unity-worker
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unity-worker-hpa
  namespace: dailycinema
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unity-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
