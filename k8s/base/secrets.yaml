apiVersion: v1
kind: Secret
metadata:
  name: dailycinema-secrets
  namespace: dailycinema
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://dailycinema:CHANGE_ME@postgres:5432/dailycinema"
  DATABASE_URL_SYNC: "postgresql+psycopg2://dailycinema:CHANGE_ME@postgres:5432/dailycinema"
  REDIS_URL: "redis://redis:6379/0"
  API_KEY: "dc-prod-api-key-change-me"
  GCS_BUCKET: "dailycinema"
