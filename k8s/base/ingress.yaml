apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dailycinema-ingress
  namespace: dailycinema
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: api.dailycinema.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
  tls:
    - hosts:
        - api.dailycinema.example.com
      secretName: dailycinema-tls
