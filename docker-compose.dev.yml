services:
  ml:
    build:
      context: ./ml_module
    volumes:
      - ./ml_module:/app
    environment:
      ACU_MODE: "${ACU_MODE:-light}"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  unity:
    build:
      context: ./unity_worker
    volumes:
      - ./unity_worker:/app
    environment:
      ACU_MODE: "${ACU_MODE:-light}"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    environment:
      ACU_MODE: "${ACU_MODE:-light}"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
